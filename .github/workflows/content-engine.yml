name: NahaLabs Content Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate article, hero image and video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NAHALABS_SITE_URL: https://nahalabs.co.za
        run: npm run content:generate

      - name: Validate
        run: |
          npm run lint
          npm run build

      - name: Open approval PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/content/manifest.json','utf8')); if(!m[0]) process.exit(1); console.log(m[0])")
          branch="content/weekly-$slug"
          git checkout -b "$branch"
          git config user.name "NahaLabs Content Engine"
          git config user.email "AI.Solutions@NahaLabs.co.za"
          git add content-engine public/content src/components/GeneratedInsightPage.tsx
          git commit -m "content: generate $slug"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "NahaLabs Intelligence: $slug" --body "Generated by the NahaLabs Content Engine. Review the evidence, article, hero image, video and distribution assets before merging."
