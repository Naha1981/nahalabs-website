<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>NahaLabs - your visits are no longer counted</title>
    <script>
      localStorage.setItem('nahalabs-no-track', '1');
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #eef1f5; color: #0c0c0c; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .box { text-align: center; padding: 2rem; max-width: 30rem; }
      .mark { width: 44px; height: 44px; border-radius: 12px; background: #496b58; margin: 0 auto 1rem; }
      p { font-size: 15px; opacity: 0.75; }
      a { color: #496b58; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark"></div>
      <h1>Done.</h1>
      <p>Visits from this device and browser will no longer count in the website numbers. Open this page once on each device and browser you use. To start counting again, clear this browser's site data.</p>
      <p><a href="/">Back to NahaLabs</a></p>
    </div>
  </body>
</html>
