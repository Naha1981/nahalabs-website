<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D1B0" />
      <stop offset="50%" stop-color="#C8AE82" />
      <stop offset="100%" stop-color="#9C8358" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2E6D0" />
      <stop offset="100%" stop-color="#C8AE82" />
    </linearGradient>
  </defs>

  <!-- Monogram N -->
  <g transform="translate(15, 20)">
    <!-- Top left square dot -->
    <rect x="0" y="2" width="7" height="7" fill="url(#goldMetallic)" />
    <!-- Left vertical bar -->
    <rect x="0" y="16" width="6.5" height="54" fill="url(#goldMetallic)" />
    <!-- Diagonal parallel strokes -->
    <path d="M 1.5 22 L 48 70 L 40 70 L 1.5 31 Z" fill="url(#goldMetallic)" />
    <path d="M 8 16 L 54.5 64 L 54.5 55 L 16 16 Z" fill="url(#goldMetallic)" />
    <!-- Right vertical bar -->
    <rect x="48" y="16" width="6.5" height="54" fill="url(#goldMetallic)" />
    <!-- Bottom right square dot -->
    <rect x="48" y="77" width="7" height="7" fill="url(#goldMetallic)" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="100" y1="26" x2="100" y2="94" stroke="url(#goldMetallic)" stroke-width="1.2" opacity="0.6" />

  <!-- Wordmark: NAHALABS -->
  <g transform="translate(126, 62)">
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="10" fill="url(#goldLight)">
      NAHALABS
    </text>
    <!-- Subtitle: INTELLIGENT SYSTEMS ENGINEERING -->
    <text y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="500" letter-spacing="4.5" fill="#A5A29B">
      INTELLIGENT SYSTEMS ENGINEERING
    </text>
  </g>
</svg>
